# pnpm 12 refuses to run any dependency's install/postinstall script until
# it is explicitly allowed here. These are pulled in transitively —
# @parcel/watcher and @swc/core by next-intl, esbuild by storybook and
# @storybook/nextjs-vite, unrs-resolver by eslint-config-next's import
# resolver — and each needs its script to select/link its native binary.
# No other dependency in this tree ships one (`pnpm install` lists exactly
# these four as "Ignored build scripts" without this file).
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  unrs-resolver: true

# postcss@8.4.31 is pulled in transitively by next@15.5.25 (both directly
# and via next-intl -> next), and is vulnerable to two high-severity
# advisories fixed upstream in postcss itself:
#   - GHSA-6g55-p6wh-862q (arbitrary file read via sourceMappingURL, fixed >=8.5.12)
#   - GHSA-r28c-9q8g-f849 (path traversal via sourceMappingURL, fixed >=8.5.18)
# next does not vendor its own copy (pnpm why postcss shows a real
# dependency edge: next > postcss), so this override resolves cleanly.
# Drop this once a next release bundles postcss >=8.5.18 on its own —
# check with `pnpm why postcss` after bumping next.
overrides:
  postcss: '>=8.5.18'
