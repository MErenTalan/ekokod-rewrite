[project]
name = "ekokod-ml"
version = "0.1.0"
description = "ekokod forecasting and anomaly service (03 §6): no database driver by design"
authors = [
    { name = "Eren Talan", email = "merentalan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.*",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "pydantic==2.*",
    "scikit-learn>=1.9.1",
    "uvicorn==0.*",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
