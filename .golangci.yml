version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  enable:
    - bodyclose
    - depguard
    - errcheck
    - errorlint
    - gocritic
    - govet
    - ineffassign
    - misspell
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
    - wastedassign

  settings:
    depguard:
      rules:
        domain-is-pure:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: "net/http"
              desc: "internal/domain performs no I/O"
            - pkg: "database/sql"
              desc: "internal/domain performs no I/O"
            - pkg: "os"
              desc: "internal/domain performs no I/O"
            - pkg: "log/slog"
              desc: "internal/domain does not log"
            - pkg: "github.com/MErenTalan/ekokod-rewrite/internal/store"
              desc: "internal/domain imports nothing from the project"
            - pkg: "github.com/MErenTalan/ekokod-rewrite/internal/api"
              desc: "internal/domain imports nothing from the project"
        # Money and energy are numeric/decimal end to end, never float64.
        # This rule was written in F0 against internal/domain/billing and
        # internal/domain/tariff, neither of which exists yet, so it has
        # never matched a single file. Task 8a pointed it at the store layer,
        # which does exist and is where the numeric columns are read and
        # written. Task 8b adds internal/domain/model, which it creates: 8a
        # left the glob off precisely because a glob for a non-existent
        # directory is the dormant-rule failure this entry exists to fix.
        #
        # Scope note: depguard matches IMPORTS, not declarations. It cannot
        # see a `Total float64` struct field, and no configuration of it can.
        # What it covers is the ARITHMETIC route into float money — math/big
        # (big.Float, and big.Rat used as a stand-in for decimal).
        #
        # The field-level half is NOT carried by review any more. It is
        # TestNoFloatFieldsInModelOrStore in internal/arch/arch_test.go, which
        # walks the same two package trees listed below with the type checker
        # and fails on any struct field resolving to float32/float64 through
        # pointers, slices, maps, arrays or aliases. The two halves are
        # deliberately kept in step: a tree added here should be added there.
        no-float-money:
          files:
            # "**/internal/store/**" already covers internal/store/postgres
            # and every other subpackage; a separate entry for it would be
            # dead config that reads as extra coverage.
            - "**/internal/store/**"
            - "**/internal/domain/model/**"
            - "**/internal/domain/billing/**"
            - "**/internal/domain/tariff/**"
          deny:
            - pkg: "math/big"
              desc: "use github.com/shopspring/decimal for monetary arithmetic"
    revive:
      rules:
        - name: exported
          disabled: false
    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
