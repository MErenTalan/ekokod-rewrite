name: ekokod

x-ekokod-env: &ekokod-env
  # required: false — Compose validates env_file on every subcommand,
  # including `down`/`ps`/`logs`, so a missing .env.docker (a fresh clone
  # before `make env-docker`/`up` has run) must not turn those into an
  # opaque "env file not found" error. A genuinely missing app config is
  # instead reported by the Go config loader itself, which already fails
  # loudly and names the variable.
  env_file: [{path: .env.docker, required: false}]

services:
  postgres:
    image: timescale/timescaledb:2.30.0-pg16
    environment:
      POSTGRES_USER: ekokod
      # No default: a committed default password is exactly the secret
      # the spec forbids. Generated fresh by scripts/gen-env-docker.sh
      # into the project's .env (Compose's own interpolation file, not
      # .env.docker) and consumed here via Compose variable substitution;
      # EKOKOD_DB_URL in .env.docker embeds the same generated value.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — run 'make env-docker' or set it in .env}
      POSTGRES_DB: ekokod
      TZ: Europe/Istanbul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekokod -d ekokod"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "4", memory: 4g }

  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }

  # migrate owns the sole build stanza for the ekokod image: api, worker and
  # scheduler below reference the same `image:` tag without their own
  # build section, so `docker compose up --build` compiles the binary
  # exactly once and every service runs the identical build (same
  # version/commit/date ldflags) rather than four independently-built
  # images that could drift from one another.
  migrate:
    image: ekokod:${VERSION:-dev}
    build:
      context: .
      args: { VERSION: "${VERSION:-dev}", COMMIT: "${COMMIT:-none}", DATE: "${DATE:-unknown}" }
    <<: *ekokod-env
    command: ["migrate", "up"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: ekokod:${VERSION:-dev}
    <<: *ekokod-env
    command: ["api"]
    ports: ["8080:8080"]
    volumes:
      - artifacts:/var/lib/ekokod
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    # api's own drain window is shutdownGrace = 30s (internal/cli/api.go:24,
    # the deadline http.Server.Shutdown is given for in-flight requests).
    # 40s gives that window headroom, instead of Docker's 10s default
    # which would SIGKILL the process before it can finish draining.
    stop_grace_period: 40s
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }

  worker:
    image: ekokod:${VERSION:-dev}
    <<: *ekokod-env
    command: ["worker"]
    volumes:
      - artifacts:/var/lib/ekokod
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    # Matches the worker's asynq drain window (min(EKOKOD_JOB_TIMEOUT,
    # job.MaxShutdownGrace) = 30s, see internal/job/server.go) plus
    # headroom, instead of Docker's 10s default which would SIGKILL a
    # draining process before it can finish.
    stop_grace_period: 40s
    deploy:
      resources:
        limits: { cpus: "4", memory: 2g }

  scheduler:
    image: ekokod:${VERSION:-dev}
    <<: *ekokod-env
    command: ["scheduler"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    # The scheduler's leader-election loop exits as soon as its context is
    # cancelled (internal/scheduler/elector.go) and releases the advisory
    # lock immediately — no in-flight work to drain. 40s matches api and
    # worker for one uniform operational shutdown envelope rather than
    # because the scheduler itself needs it.
    stop_grace_period: 40s
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      EKOKOD_INTERNAL_API_URL: http://api:8080
      TZ: Europe/Istanbul
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  artifacts:
